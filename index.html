<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- 设置浏览器主题色，与UI背景融合 -->
  <meta name="theme-color" content="#020210">
  <title>神经界面 · 小陆</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020210; font-family: 'Segoe UI', 'Arial', sans-serif; color: #b0e0ff; overflow: hidden; height: 100vh; }
    .main-container {
      position: relative; z-index:1; width:100%; height:100%;
      display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 1fr;
      transition: grid-template-columns 0.5s ease;
    }
    .main-container.mode2 { grid-template-columns: 1fr 320px; }
    .left-panel {
      background: rgba(8,15,28,0.75); backdrop-filter: blur(15px);
      border-right: 1px solid rgba(0, 200, 255, 0.4);
      display: flex; flex-direction: column;
      height:100%; box-shadow: 4px 0 20px rgba(0, 180, 255, 0.2);
      transition: border 0.5s, order 0s;
      order: 0;
    }
    .center-panel { position: relative; background: transparent; overflow: hidden; order: 0; }
    .main-container.mode2 .left-panel {
      order: 2; border-right: none;
      border-left: 1px solid rgba(0, 200, 255, 0.4);
      box-shadow: -4px 0 20px rgba(0, 180, 255, 0.2);
    }
    .main-container.mode2 .center-panel { order: 1; }
    .bubble-container { height: 180px; border-bottom: 1px solid rgba(0, 200, 255, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(0,150,255,0.04) 0%, transparent 70%); }
    #bubbleCanvas { width:100%; height:150px; display:block; }
    .status-text { font-size: 11px; color: #8090a0; letter-spacing: 1px; padding: 2px 0 6px 0; text-shadow: 0 0 8px rgba(100,160,255,0.4); }
    .status-text.listening { color: #6ae06a; text-shadow: 0 0 10px #4a8; }
    .status-text.speaking { color: #e0c06a; text-shadow: 0 0 10px #c84; }
    .history-chat {
      flex: 1 1 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap:8px;
      scrollbar-width: thin; scrollbar-color: rgba(0, 200, 255, 0.4) transparent;
    }
    .history-chat::-webkit-scrollbar { width:4px; }
    .history-chat::-webkit-scrollbar-thumb { background: rgba(0, 200, 255, 0.5); border-radius:4px; }
    .chat-item {
      padding:10px 14px; background: rgba(0, 100, 200, 0.08);
      border:1px solid rgba(0, 200, 255, 0.2); border-radius:12px;
      color:#c0d0e0; font-size:13px; line-height:1.5;
      backdrop-filter: blur(5px); transition: all 0.2s ease; cursor: pointer;
    }
    .chat-item:hover { border-color: rgba(0, 255, 255, 0.5); background: rgba(0, 150, 255, 0.15); box-shadow: 0 0 15px rgba(0, 200, 255, 0.3); }
    .chat-item .time { font-size:10px; color:#6a8a9a; margin-top:6px; }
    .input-area {
      border-top: 1px solid rgba(0, 200, 255, 0.3); padding: 10px 12px; display: flex; gap: 6px;
      background: rgba(0,0,0,0.3); flex-shrink: 0;
    }
    .input-area input {
      flex:1; background: rgba(20,30,50,0.7); border: 1px solid rgba(0, 200, 255, 0.4);
      border-radius: 20px; padding: 8px 14px; color: #e0f0ff; font-size: 13px; outline: none;
    }
    .input-area input::placeholder { color: #5a6a7a; }
    .input-area button {
      width: 36px; height:36px; border-radius: 50%; background: rgba(0, 180, 255, 0.2);
      border: 1px solid rgba(0, 255, 255, 0.5); color: #80e0ff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .input-area button:hover { background: rgba(0, 220, 255, 0.4); box-shadow: 0 0 15px rgba(0, 200, 255, 0.6); }
    .system-info {
      border-top: 1px solid rgba(0, 200, 255, 0.3); padding: 8px 14px; display: flex; flex-direction: column; gap:5px;
      background: rgba(0,0,0,0.4); flex-shrink: 0;
    }
    .info-row { display: flex; align-items: center; justify-content: space-between; font-size:11px; color:#8aa0b0; letter-spacing:0.5px; }
    .info-row .value {
      color:#e0f0ff; font-weight:bold; background: rgba(0, 200, 255, 0.2); padding:2px 8px; border-radius:8px;
    }
    #coreCanvas, #earthCanvas, #webFrame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    #coreCanvas.active, #earthCanvas.active, #webFrame.active { display: block; }
    #webFrame { border: none; background: #000; }
    .core-title {
      position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
      color: #e0d0c0; font-size: 30px; font-weight: bold; letter-spacing: 12px;
      text-shadow: 0 0 20px rgba(139,90,43,0.8), 0 0 40px rgba(200,160,100,0.6);
      z-index: 5; pointer-events: none;
    }
    .bottom-chat {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 60%; max-width: 700px; max-height: 60vh; overflow-y: auto;
      background: rgba(10,18,32,0.92); backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 200, 255, 0.5); border-radius: 20px; padding: 14px 18px;
      display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0, 200, 255, 0.3);
      transition: opacity 0.3s; opacity: 0; pointer-events: none; z-index: 10; color: #e0f0ff; font-size: 14px;
    }
    .bottom-chat.visible { opacity: 1; pointer-events: auto; bottom: 30px; }
    .bottom-chat .ai-message { margin-bottom: 6px; }
    .bottom-chat .timestamp { font-size: 10px; color: #8a7a6a; align-self: flex-end; }
    .hot-card {
      position: absolute; width: 220px; background: rgba(10, 18, 32, 0.85); backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 200, 255, 0.4); border-radius: 16px; padding: 12px 16px;
      color: #d0e0ff; font-size: 12px; line-height: 1.5; box-shadow: 0 0 25px rgba(0,0,0,0.6); z-index: 8; display: none;
    }
    .hot-card.top-left { top: 20px; left: 20px; }
    .hot-card.top-right { top: 20px; right: 20px; }
    .hot-card.bottom-left { bottom: 20px; left: 20px; }
    .hot-card.bottom-right { bottom: 20px; right: 20px; }
    .hot-card .platform { font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #f0d090; text-shadow: 0 0 10px rgba(200,160,100,0.6); }
    .hot-card .item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(0, 200, 255, 0.2); }
    .hot-card .item:last-child { border-bottom: none; }
    .hot-card .rank { color: #a09080; width: 20px; }
    .hot-card .title { flex:1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .weather-card {
      position: absolute; top: 20px; right: 20px; width: 260px;
      background: rgba(10, 18, 32, 0.9); backdrop-filter: blur(15px);
      border: 1px solid rgba(0, 200, 255, 0.5); border-radius: 20px; padding: 16px 18px;
      color: #e0f0ff; box-shadow: 0 0 40px rgba(0, 200, 255, 0.3); z-index: 12; display: none;
      animation: fadeSlideIn 0.4s ease;
    }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    .weather-card .city { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #ffd080; text-shadow: 0 0 10px rgba(200,160,100,0.6); }
    .weather-card .main-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .weather-card .temp { font-size: 36px; font-weight: 300; color: #ffffff; line-height: 1; }
    .weather-card .desc { font-size: 14px; color: #b0d0ff; text-align: right; }
    .weather-card .details { display: flex; justify-content: space-between; font-size: 11px; color: #8090a0; border-top: 1px solid rgba(0, 200, 255, 0.3); padding-top: 10px; }
    .weather-card .details span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  </style>
</head>
<body>
  <div class="main-container" id="mainContainer">
    <div class="left-panel" id="sidePanel">
      <div class="bubble-container"><canvas id="bubbleCanvas"></canvas><div class="status-text" id="bubbleStatus">聆听中</div></div>
      <div class="history-chat" id="historyChat">
        <div class="chat-item">系统：神经界面已启动。<br><div class="time">10:23</div></div>
        <div class="chat-item">系统：全息核心已激活。<br><div class="time">10:24</div></div>
      </div>
      <div class="input-area"><input type="text" id="userInput" placeholder="输入指令..."><button id="sendTextBtn">▶</button></div>
      <div class="system-info" id="systemInfo">
        <div class="info-row"><span>🧠 CPU</span><span class="value" id="cpuValue">--</span></div>
        <div class="info-row"><span>📊 内存</span><span class="value" id="memValue">--</span></div>
        <div class="info-row"><span>🎮 GPU</span><span class="value" id="gpuValue">--</span></div>
      </div>
    </div>
    <div class="center-panel" id="centerPanel">
      <canvas id="coreCanvas" class="active"></canvas>
      <canvas id="earthCanvas"></canvas>
      <iframe id="webFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      <div class="core-title" id="coreTitle">小陆</div>
      <div class="weather-card" id="weatherCard">
        <div class="city" id="weatherCity">北京</div>
        <div class="main-info"><div class="temp" id="weatherTemp">26°</div><div class="desc" id="weatherDesc">晴</div></div>
        <div class="details"><span>💧 <span id="weatherHumidity">45%</span></span><span>🌬️ <span id="weatherWind">3级</span></span><span>🌅 <span id="weatherAqi">优</span></span></div>
      </div>
      <div class="hot-card top-left" id="hotDouyin"><div class="platform">🎵 抖音</div></div>
      <div class="hot-card top-right" id="hotXiaohongshu"><div class="platform">📕 小红书</div></div>
      <div class="hot-card bottom-left" id="hotWeibo"><div class="platform">🐦 微博</div></div>
      <div class="hot-card bottom-right" id="hotNews"><div class="platform">📰 新闻</div></div>
      <div class="bottom-chat" id="bottomChat"><div class="ai-message" id="aiMessage">……</div><div class="timestamp" id="aiTimestamp"></div></div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const coreCanvas = document.getElementById('coreCanvas');
    const earthCanvas = document.getElementById('earthCanvas');
    const webFrame = document.getElementById('webFrame');

    // 核心场景
    const coreScene = new THREE.Scene();
    coreScene.background = new THREE.Color(0x050810);
    const coreCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    coreCamera.position.set(0, 1.2, 4.5);
    const coreRenderer = new THREE.WebGLRenderer({ canvas: coreCanvas, antialias: true });
    coreRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    coreRenderer.toneMapping = THREE.ACESFilmicToneMapping;
    coreRenderer.toneMappingExposure = 1.2;
    coreRenderer.setClearColor(0x050810, 1);
    const composer = new EffectComposer(coreRenderer);
    composer.addPass(new RenderPass(coreScene, coreCamera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(coreCanvas.clientWidth, coreCanvas.clientHeight), 1.5, 0.5, 0.2);
    composer.addPass(bloom);
    const coreControls = new OrbitControls(coreCamera, coreRenderer.domElement);
    coreControls.enableDamping = true; coreControls.dampingFactor = 0.06;
    coreControls.autoRotate = true; coreControls.autoRotateSpeed = 0.5;
    coreControls.minDistance = 2.5; coreControls.maxDistance = 10;
    coreControls.target.set(0, 0.3, 0);

    // 星空
    const starsGeo = new THREE.BufferGeometry();
    const starsPos = new Float32Array(4000 * 3);
    for (let i = 0; i < 4000 * 3; i += 3) {
      const r = 18 + Math.random() * 40, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      starsPos[i] = r * Math.sin(ph) * Math.cos(th);
      starsPos[i+1] = r * Math.sin(ph) * Math.sin(th);
      starsPos[i+2] = r * Math.cos(ph);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    const starsField = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.12, blending: THREE.AdditiveBlending, depthWrite: false }));
    coreScene.add(starsField);

    // 光照
    coreScene.add(new THREE.AmbientLight(0x445566, 3.0));
    const sunLight = new THREE.PointLight(0xfff5e8, 20, 55);
    sunLight.position.set(0, 0, 0);
    coreScene.add(sunLight);
    coreScene.add(new THREE.DirectionalLight(0x8899cc, 3.0).position.set(4, 2, 4));
    coreScene.add(new THREE.DirectionalLight(0xffffff, 2.5).position.set(-2, -0.5, -4));

    // 辅助函数
    function createAtmoLayer(radius, color1, color2, power, alpha) {
      const geo = new THREE.SphereGeometry(radius, 80, 60);
      const mat = new THREE.ShaderMaterial({
        uniforms: { uColor1: { value: new THREE.Color(color1) }, uColor2: { value: new THREE.Color(color2) }, uPower: { value: power }, uAlpha: { value: alpha } },
        vertexShader: `varying vec3 vN,vP; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.); vP=mv.xyz; vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*mv; }`,
        fragmentShader: `varying vec3 vN,vP; uniform vec3 uColor1,uColor2; uniform float uPower,uAlpha; void main(){ vec3 v=normalize(-vP); float f=1.-abs(dot(v,vN)); f=pow(f,uPower); vec3 col=mix(uColor1,uColor2,f); gl_FragColor=vec4(col,f*uAlpha); }`,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      });
      const mesh = new THREE.Mesh(geo, mat); mesh.renderOrder = 1; return mesh;
    }

    function createBumpTexture() {
      const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d'); ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < 2500; i++) {
        const x = Math.random()*canvas.width, y = Math.random()*canvas.height, r = 1+Math.random()*10;
        ctx.fillStyle = Math.random()<0.5?`rgba(255,255,255,${0.05+Math.random()*0.35})`:`rgba(0,0,0,${0.05+Math.random()*0.35})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
      const bumpTex = new THREE.CanvasTexture(canvas); bumpTex.colorSpace = THREE.LinearSRGBColorSpace; return bumpTex;
    }

    // 行星纹理函数 (简化版，保留原版所有纹理生成)
    function createMercuryTexture() { const W=2048,H=1024; const c=document.createElement('canvas');c.width=W;c.height=H; const ctx=c.getContext('2d'); const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#7a7568');bg.addColorStop(0.5,'#90887b');bg.addColorStop(1,'#736b60');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H); const img=ctx.getImageData(0,0,W,H);for(let i=0;i<img.data.length;i+=4){const n=(Math.random()-0.5)*28;img.data[i]=Math.min(255,Math.max(0,img.data[i]+n));img.data[i+1]=Math.min(255,Math.max(0,img.data[i+1]+n));img.data[i+2]=Math.min(255,Math.max(0,img.data[i+2]+n));}ctx.putImageData(img,0,0); [{x:900,y:380,r:140},{x:1500,y:300,r:100},{x:500,y:550,r:120},{x:1200,y:650,r:90},{x:300,y:250,r:110}].forEach(cr=>{const g=ctx.createRadialGradient(cr.x,cr.y,cr.r*0.3,cr.x,cr.y,cr.r);g.addColorStop(0,'rgba(55,50,42,0.55)');g.addColorStop(0.5,'rgba(65,58,48,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cr.x,cr.y,cr.r,0,Math.PI*2);ctx.fill();}); for(let i=0;i<500;i++){const x=Math.random()*W,y=Math.random()*H,r=3+Math.random()*35;const g=ctx.createRadialGradient(x-r*0.15,y-r*0.15,r*0.05,x,y,r);g.addColorStop(0,'rgba(45,40,34,0.65)');g.addColorStop(0.4,'rgba(55,48,40,0.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();} for(let i=0;i<3000;i++){const x=Math.random()*W,y=Math.random()*H,r=0.8+Math.random()*4;ctx.fillStyle=`rgba(50,44,36,${0.1+Math.random()*0.35})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();} const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;tex.colorSpace=THREE.SRGBColorSpace;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.magFilter=THREE.LinearFilter;tex.generateMipmaps=true;return tex; }
    function createVenusTexture() { const W=2048,H=1024; const c=document.createElement('canvas');c.width=W;c.height=H; const ctx=c.getContext('2d'); const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#e8d8b0');bg.addColorStop(0.5,'#ebdabc');bg.addColorStop(1,'#d4c090');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H); for(let y=0;y<H;y+=4+Math.random()*12){ctx.fillStyle=`rgba(${Math.random()<0.5?255:170},${Math.random()<0.5?245:140},${Math.random()<0.5?210:80},${0.02+Math.random()*0.08})`;ctx.fillRect(0,y,W,2+Math.random()*6);} for(let i=0;i<300;i++){const cx=Math.random()*W,cy=Math.random()*H,r=20+Math.random()*120;const g=ctx.createRadialGradient(cx,cy,r*0.1,cx,cy,r);g.addColorStop(0,Math.random()<0.6?'rgba(255,240,200,0.15)':'rgba(180,140,80,0.12)');g.addColorStop(0.5,Math.random()<0.6?'rgba(220,180,120,0.1)':'rgba(140,100,60,0.08)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();} const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;tex.colorSpace=THREE.SRGBColorSpace;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.magFilter=THREE.LinearFilter;tex.generateMipmaps=true;return tex; }
    function createMarsTexture() { const W=2048,H=1024; const c=document.createElement('canvas');c.width=W;c.height=H; const ctx=c.getContext('2d'); const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#d8876a');bg.addColorStop(0.5,'#d09068');bg.addColorStop(1,'#d8876a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H); const img=ctx.getImageData(0,0,W,H);for(let i=0;i<img.data.length;i+=4){const n=(Math.random()-0.5)*30;img.data[i]=Math.min(255,Math.max(0,img.data[i]+n));img.data[i+1]=Math.min(255,Math.max(0,img.data[i+1]+n*0.8));img.data[i+2]=Math.min(255,Math.max(0,img.data[i+2]+n*0.5));}ctx.putImageData(img,0,0); const npg=ctx.createLinearGradient(0,0,0,H*0.15);npg.addColorStop(0,'rgba(240,240,245,0.9)');npg.addColorStop(0.6,'rgba(220,225,235,0.6)');npg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=npg;ctx.fillRect(0,0,W,H*0.15); const spg=ctx.createLinearGradient(0,H,0,H*0.85);spg.addColorStop(0,'rgba(240,240,245,0.85)');spg.addColorStop(0.5,'rgba(220,225,235,0.5)');spg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=spg;ctx.fillRect(0,H*0.85,W,H*0.15); [{x:1400,y:620,r:160},{x:500,y:300,r:120},{x:1000,y:450,r:100},{x:1600,y:350,r:110}].forEach(b=>{const g=ctx.createRadialGradient(b.x,b.y,b.r*0.2,b.x,b.y,b.r);g.addColorStop(0,'rgba(160,90,60,0.45)');g.addColorStop(0.6,'rgba(180,100,70,0.25)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();}); for(let i=0;i<700;i++){const x=Math.random()*W,y=Math.random()*H,r=3+Math.random()*38;const g=ctx.createRadialGradient(x-r*0.1,y-r*0.1,r*0.05,x,y,r);g.addColorStop(0,'rgba(80,35,20,0.6)');g.addColorStop(0.5,'rgba(130,70,45,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();} const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;tex.colorSpace=THREE.SRGBColorSpace;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.magFilter=THREE.LinearFilter;tex.generateMipmaps=         const t=Math.min((now-sTime)/1200,1); const ease=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
        earthCamera.position.lerpVectors(sPos,defaultPos,ease); earthControls.target.lerpVectors(sTar,defaultTarget,ease); earthControls.update();
        if(t<1) resetAnim=requestAnimationFrame(anim);
        else{earthCamera.position.copy(defaultPos);earthControls.target.copy(defaultTarget);earthControls.update();clearEarthReset();}
      }
      resetAnim=requestAnimationFrame(anim);
    }
    earthRenderer.domElement.addEventListener('pointerdown',clearEarthReset); window.addEventListener('pointerup',startEarthReset);
    earthRenderer.domElement.addEventListener('wheel',()=>{clearEarthReset();clearTimeout(window.__wt);window.__wt=setTimeout(startEarthReset,800)},{passive:true});
    const earthGroup = new THREE.Group(); earthScene.add(earthGroup); const rotateGroup = new THREE.Group(); earthGroup.add(rotateGroup);
    const R=1.0; const earthGeo = new THREE.SphereGeometry(R,128,96);
    const earthMat = new THREE.MeshStandardMaterial({roughness:0.5,metalness:0});
    const earthMesh = new THREE.Mesh(earthGeo,earthMat); rotateGroup.add(earthMesh);
    const eLoader = new THREE.TextureLoader();
    eLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', tex=>{tex.colorSpace=THREE.SRGBColorSpace;earthMat.map=tex;earthMat.needsUpdate=true;});
    const cloudGeo = new THREE.SphereGeometry(R*1.01,96,72);
    const cloudMat = new THREE.MeshPhongMaterial({color:0xffffff,transparent:true,opacity:0.38,depthWrite:false});
    const cloudMesh = new THREE.Mesh(cloudGeo,cloudMat); rotateGroup.add(cloudMesh);
    eLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png', tex=>{cloudMat.map=tex;cloudMat.alphaMap=tex;cloudMat.needsUpdate=true;});
    const edgeGeo = new THREE.SphereGeometry(R*1.08,80,60);
    const edgeMat = new THREE.ShaderMaterial({vertexShader:`varying vec3 vN,vP;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vP=mv.xyz;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*mv;}`,fragmentShader:`varying vec3 vN,vP;void main(){vec3 v=normalize(-vP);float f=1.0-abs(dot(v,vN));f=pow(f,5.5);gl_FragColor=vec4(vec3(0.38,0.6,0.88),f*0.12);}`,transparent:true,depthWrite:false});
    const edgeMesh = new THREE.Mesh(edgeGeo,edgeMat); edgeMesh.renderOrder=1; earthGroup.add(edgeMesh);
    earthScene.add(new THREE.AmbientLight(0x405070,1.8)); earthScene.add(new THREE.HemisphereLight(0x8899cc,0x203050,0.8));
    const eSun = new THREE.DirectionalLight(0xffffff,5.5); eSun.position.set(2.5,1.2,-3.0); earthScene.add(eSun);

    // UI 通用
    const mainContainer = document.getElementById('mainContainer');
    const coreTitle = document.getElementById('coreTitle');
    const hotCards = document.querySelectorAll('.hot-card');
    const weatherCard = document.getElementById('weatherCard');
    const bottomChat = document.getElementById('bottomChat');

    function resizeAll(){
      const w=document.getElementById('centerPanel').clientWidth, h=document.getElementById('centerPanel').clientHeight;
      coreRenderer.setSize(w,h); coreCamera.aspect=w/h; coreCamera.updateProjectionMatrix();
      earthRenderer.setSize(w,h); earthCamera.aspect=w/h; earthCamera.updateProjectionMatrix();
      bubbleRenderer.setSize(bubbleCanvas.clientWidth,bubbleCanvas.clientHeight); bubbleCamera.aspect=bubbleCanvas.clientWidth/bubbleCanvas.clientHeight; bubbleCamera.updateProjectionMatrix();
      composer.setSize(w,h);
    }
    new ResizeObserver(resizeAll).observe(document.getElementById('centerPanel')); window.addEventListener('resize',resizeAll); resizeAll();

    // 软件映射
    const softwareMap = {
      '微信': 'https://wx.qq.com', '抖音': 'https://www.douyin.com', '小红书': 'https://www.xiaohongshu.com',
      '微博': 'https://weibo.com', '淘宝': 'https://www.taobao.com', '京东': 'https://www.jd.com',
      '百度': 'https://www.baidu.com', '谷歌': 'https://www.google.com', 'b站': 'https://www.bilibili.com',
      'bilibili': 'https://www.bilibili.com', '知乎': 'https://www.zhihu.com', '网易云音乐': 'https://music.163.com',
      'qq音乐': 'https://y.qq.com', '腾讯视频': 'https://v.qq.com', '爱奇艺': 'https://www.iqiyi.com',
      'github': 'https://github.com', 'gitee': 'https://gitee.com',
    };

    function openWebsite(name) {
      const url = softwareMap[name];
      if (url) {
        webFrame.src = url;
      } else {
        webFrame.src = `https://www.baidu.com/s?wd=${encodeURIComponent(name)}`;
      }
      setMode(3);
      addAIReply(`已打开 ${name || '网页'}`);
      speak(`正在打开 ${name || '网页'}`);
    }

    function setMode(mode) {
      coreCanvas.classList.remove('active');
      earthCanvas.classList.remove('active');
      webFrame.classList.remove('active');
      coreTitle.style.display = 'none';
      hotCards.forEach(c => c.style.display = 'none');
      weatherCard.style.display = 'none';
      mainContainer.classList.remove('mode2');

      if (mode === 1) {
        coreCanvas.classList.add('active');
        coreTitle.style.display = 'block';
      } else if (mode === 2) {
        earthCanvas.classList.add('active');
        hotCards.forEach(c => c.style.display = 'block');
        updateHotspots();
        mainContainer.classList.add('mode2');
      } else if (mode === 3) {
        webFrame.classList.add('active');
      }
    }

    function updateHotspots(){
      setCard('hotDouyin',['#挑战换装','#夏日旅行','#美食测评']); setCard('hotXiaohongshu',['护肤好物分享','一周穿搭','沉浸式回家']);
      setCard('hotWeibo',['#某某新剧','#世界杯','#今日说法']); setCard('hotNews',['国内经济数据','科技突破','国际要闻']);
    }
    function setCard(id,items){ const card=document.getElementById(id); let h=card.querySelector('.platform').outerHTML; items.forEach((t,i)=>h+=`<div class="item"><span class="rank">${i+1}</span><span class="title">${t}</span></div>`); h+=`<div style="font-size:10px;color:#6a5a4a;margin-top:6px;">实时</div>`; card.innerHTML=h; }
    updateHotspots();

    function showWeather(loc='北京'){
      const d={ '北京':{temp:26,desc:'晴',humidity:'45%',wind:'3级',aqi:'优'}, '上海':{temp:28,desc:'多云',humidity:'60%',wind:'4级',aqi:'良'}, '广州':{temp:32,desc:'雷阵雨',humidity:'85%',wind:'2级',aqi:'优'}, '默认':{temp:24,desc:'阴',humidity:'55%',wind:'2级',aqi:'良'} }[loc]||{temp:24,desc:'阴',humidity:'55%',wind:'2级',aqi:'良'};
      document.getElementById('weatherCity').textContent=loc; document.getElementById('weatherTemp').textContent=d.temp+'°'; document.getElementById('weatherDesc').textContent=d.desc;
      document.getElementById('weatherHumidity').textContent=d.humidity; document.getElementById('weatherWind').textContent=d.wind; document.getElementById('weatherAqi').textContent=d.aqi;
      weatherCard.style.display='block';
    }
    function hideWeather(){ weatherCard.style.display='none'; }

    const userInput = document.getElementById('userInput');
    // ==================== 流式输出核心逻辑 ====================
    let streamTimer = null;             // 流式输出定时器
    let currentStreamBubble = null;   // 当前流式气泡 DOM
    let currentStreamText = '';       // 当前累积文本

    function startStreamReply(fullText) {
      // 清除之前的流式定时器
      clearTimeout(streamTimer);
      // 设置状态为“说话中”
      aiSpeaking = true;
      document.getElementById('bubbleStatus').textContent = '说话中';
      document.getElementById('bubbleStatus').className = 'status-text speaking';
      
      // 创建新气泡
      const h = document.getElementById('historyChat');
      const item = document.createElement('div');
      item.className = 'chat-item';
      item.innerHTML = `<span class="chat-text">小陆：</span><br><div class="time">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>`;
      h.appendChild(item);
      h.scrollTop = h.scrollHeight;
      currentStreamBubble = item;
      currentStreamText = '';
      
      // 显示底部对话框
      document.getElementById('bottomChat').classList.add('visible');
      
      // 开始逐字输出
      streamText(fullText, 0);
    }

    function streamText(text, index) {
      if (!currentStreamBubble) return;
      
      if (index < text.length) {
        const chunk = text.slice(0, index + 1);
        const span = currentStreamBubble.querySelector('.chat-text');
        if (span) span.textContent = '小陆：' + chunk;
        
        // 同步更新底部浮动对话框
        document.getElementById('aiMessage').textContent = '小陆：' + chunk;
        document.getElementById('aiTimestamp').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        
        document.getElementById('historyChat').scrollTop = document.getElementById('historyChat').scrollHeight;
        
        // 随机延迟 30~70ms，模拟打字效果
        streamTimer = setTimeout(() => streamText(text, index + 1), 30 + Math.random() * 40);
      } else {
        // 流式输出完成
        finishStreamReply();
      }
    }

    function finishStreamReply() {
      if (!currentStreamBubble) return;
      
      // 更新最终时间戳
      const timeEl = currentStreamBubble.querySelector('.time');
      if (timeEl) timeEl.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      
      // 重置状态
      aiSpeaking = false;
      document.getElementById('bubbleStatus').textContent = '聆听中';
      document.getElementById('bubbleStatus').className = 'status-text listening';
      
      currentStreamBubble = null;
      currentStreamText = '';
      
      // 底部对话框延时隐藏
      clearTimeout(window.speakTimeout);
      window.speakTimeout = setTimeout(() => {
        document.getElementById('bottomChat').classList.remove('visible');
      }, 2500);
    }

    // ==================== 用户消息处理 ====================
    function userAsk(q){
      if(!q.trim()) return;
      const history=document.getElementById('historyChat'); const qi=document.createElement('div'); qi.className='chat-item';
      qi.innerHTML=`你：${q}<br><div class="time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`; history.appendChild(qi); history.scrollTop=history.scrollHeight;

      if(q.includes('打开')) {
        const target = q.replace('打开','').trim();
        if(target) openWebsite(target);
        return;
      }
      if(q.includes('热点')){ setMode(2); addAIReply("已切换至热点模式。"); speak("已切换至热点模式。"); }
      else if(q.includes('天气')){
        setMode(1); let loc='北京'; if(q.includes('上海')) loc='上海'; else if(q.includes('广州')) loc='广州';
        showWeather(loc); const d={北京:{desc:'晴',temp:'26°',humidity:'45%',wind:'3级',aqi:'优'},上海:{desc:'多云',temp:'28°',humidity:'60%',wind:'4级',aqi:'良'},广州:{desc:'雷阵雨',temp:'32°',humidity:'85%',wind:'2级',aqi:'优'}}[loc]||{desc:'阴',temp:'24°',humidity:'55%',wind:'2级',aqi:'良'};
        const rep=`${loc}今天${d.desc}，气温${d.temp}，湿度${d.humidity}，风力${d.wind}，空气${d.aqi}。`; addAIReply(rep); speak(rep);
        clearTimeout(window.whTimer); window.whTimer=setTimeout(hideWeather,7000);
      } else if(q.includes('返回')||q.includes('退出')||q.includes('关闭')){ setMode(1); addAIReply("已返回标准模式。"); speak("已返回标准模式。"); }
      else {
        // ★ 一般消息：使用流式输出
        const replies = [
          "这就为您分析这个问题…",
          "根据当前数据模型，我们可能需要考虑多个维度的因素。",
          "其实这个问题的答案比想象中复杂，我们一步一步来看。",
          "已根据您的需求生成了详细的报告，请过目。",
          "正在查询实时数据，请稍候…"
        ];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        startStreamReply(reply);
      }
    }
    function addAIReply(t){ const h=document.getElementById('historyChat'); const ai=document.createElement('div'); ai.className='chat-item'; ai.innerHTML=`小陆：${t}<br><div class="time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`; h.appendChild(ai); h.scrollTop=h.scrollHeight; }
    function speak(m){ document.getElementById('aiMessage').textContent='小陆：'+m; document.getElementById('aiTimestamp').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); bottomChat.classList.add('visible'); clearTimeout(window.spkTmr); window.spkTmr=setTimeout(()=>bottomChat.classList.remove('visible'),3500); }
    document.getElementById('sendTextBtn').addEventListener('click',()=>{userAsk(userInput.value); userInput.value='';});
    userInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){userAsk(userInput.value); userInput.value='';} });
    hideWeather();
    setMode(1);

    // 动画
    const coreClock = new THREE.Clock();
    function animateCore(){
      requestAnimationFrame(animateCore); const t=coreClock.getElapsedTime();
      planets.forEach(p=>{ p.userData.angle+=p.userData.speed; p.position.x=Math.cos(p.userData.angle)*p.userData.distance; p.position.z=Math.sin(p.userData.angle)*p.userData.distance; p.rotation.y+=0.015; });
      starsField.rotation.y+=0.0001; starsField.rotation.x+=0.00005;
      brainGroup.rotation.y -= 0.003; brainGroup.rotation.z += 0.001;
      brainWire1.rotation.y += 0.004; brainWire2.rotation.y += 0.002;
      brainNodes.forEach((n,i)=>{ n.scale.setScalar(0.8+Math.sin(t*3+i)*0.4); n.material.opacity=0.7+Math.sin(t*2+i)*0.3; });
      ring1.rotation.z += 0.006;
      ring2Group.rotation.y += 0.012; ring2Group.rotation.x = Math.PI/4+Math.sin(t*0.8)*0.5;
      ring3.rotation.x += 0.004;
      particleSystem.rotation.y += 0.002; particleSystem.rotation.x += 0.001;
      const ep=eBuf.attributes.position.array;
      for(let i=0;i<eCount;i++){ ep[i*3+1]+=eVel[i]; if(ep[i*3+1]>1.8){ const ang=Math.random()*Math.PI*2,rad=Math.random()*0.4; ep[i*3]=Math.cos(ang)*rad; ep[i*3+1]=-0.7+Math.random()*0.3; ep[i*3+2]=Math.sin(ang)*rad; } }
      eBuf.attributes.position.needsUpdate=true;
      coreControls.update(); composer.render();
    }
    animateCore();

    const earthClock = new THREE.Clock();
    function animateEarth(){ requestAnimationFrame(animateEarth); const dt=Math.min(earthClock.getDelta(),0.1); rotateGroup.rotation.y+=0.16*dt; earthControls.update(); earthRenderer.render(earthScene,earthCamera); }
    animateEarth();

    function updateSys(){
      document.getElementById('cpuValue').textContent=(navigator.hardwareConcurrency||4)+'核 '+Math.floor(10+Math.random()*40)+'%';
      if(performance.memory){const u=performance.memory.usedJSHeapSize/1048576,t=performance.memory.jsHeapSizeLimit/1048576; document.getElementById('memValue').textContent=u.toFixed(0)+' / '+t.toFixed(0)+' MB';} else document.getElementById('memValue').textContent='不支持';
      if(!updateSys.gpu){const c=document.createElement('canvas'),gl=c.getContext('webgl2')||c.getContext('webgl'); if(gl){const ext=gl.getExtension('WEBGL_debug_renderer_info'); updateSys.gpu=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'未知';} else updateSys.gpu='不支持';}
      document.getElementById('gpuValue').textContent=updateSys.gpu;
    }
    updateSys(); setInterval(updateSys,1000);
  </script>
</body>
</html>
